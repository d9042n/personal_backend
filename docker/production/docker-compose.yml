version: "3.8"

services:
  backend:
    build:
      context: ../../
      dockerfile: docker/production/Dockerfile
      args:
        - ENVIRONMENT=production
    ports:
      - "8000:8000"
    env_file:
      - ../../.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f ${HEALTH_CHECK_URL:-http://localhost:8000/health/} || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - DJANGO_SETTINGS_MODULE=personal_backend.settings
      - HEALTH_CHECK_URL=${HEALTH_CHECK_URL}
    volumes:
      - static_files:/app/staticfiles:rw
      - media_files:/app/media:rw

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    env_file:
      - ../../.env.production
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data_prod:/data
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "6379:6379"

networks:
  backend:
    driver: bridge
    internal: false
    name: production_network
  monitoring:
    external: true
    name: monitoring
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
    name: personal_postgres_prod
  redis_data_prod:
    driver: local
    name: personal_redis_prod
  static_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_STATIC_ROOT:-/var/www/personal/static}
  media_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_MEDIA_ROOT:-/var/www/personal/media}
