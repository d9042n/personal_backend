version: "3.8"

services:
  backend:
    build:
      context: ../../
      dockerfile: docker/development/Dockerfile
      args:
        - ENVIRONMENT=development
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../../:/app
      - python-packages:/usr/local/lib/python3.11/site-packages/
    ports:
      - "8000:8000"
    env_file:
      - ../../.env.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    env_file:
      - ../../.env.development
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  backend:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
  python-packages:
    driver: local
