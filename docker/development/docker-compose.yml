version: "3.8"

services:
  backend:
    build:
      context: ../../
      dockerfile: docker/development/Dockerfile
      args:
        - ENVIRONMENT=development
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../../:/app:cached
      - python-packages:/usr/local/lib/python3.11/site-packages/
    ports:
      - "8000:8000"
    env_file:
      - ../../.env.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    env_file:
      - ../../.env.development
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data_dev:/data
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "6379:6379"

networks:
  backend:
    driver: bridge
    name: development_network
  monitoring:
    external: true
    name: monitoring-development
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
    name: personal_postgres_dev
  redis_data_dev:
    driver: local
    name: personal_redis_dev
  python-packages:
    driver: local
