version: "3.8"

services:
  backend:
    build:
      context: ../../
      dockerfile: docker/staging/Dockerfile
      args:
        - ENVIRONMENT=staging
    ports:
      - "8000:8000"
    env_file:
      - ../../.env.staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - static_files:/app/staticfiles:rw
      - media_files:/app/media:rw

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    env_file:
      - ../../.env.staging
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data_staging:/data
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "6379:6379"

networks:
  backend:
    driver: bridge
    internal: false
    name: staging_network
  monitoring:
    driver: bridge
    name: monitoring

volumes:
  postgres_data_staging:
    driver: local
    name: personal_postgres_staging
  redis_data_staging:
    driver: local
    name: personal_redis_staging
  static_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_STATIC_ROOT}
  media_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_MEDIA_ROOT}
