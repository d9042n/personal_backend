version: "3.8"

services:
  backend:
    build:
      context: ../../
      dockerfile: docker/staging/Dockerfile
      args:
        - ENVIRONMENT=staging
    ports:
      - "8001:8000"
    env_file:
      - ../../.env.staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    env_file:
      - ../../.env.staging
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data_staging:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data_staging:
    driver: local
  redis_data_staging:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local
