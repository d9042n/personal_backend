version: "3.8"

services:
  prometheus:
    extends:
      file: ../common/docker-compose.yml
      service: prometheus
    env_file:
      - ../../../.env.development
    volumes:
      - ../common/prometheus/config:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  loki:
    extends:
      file: ../common/docker-compose.yml
      service: loki
    env_file:
      - ../../../.env.development
    volumes:
      - ../common/loki/config:/etc/loki
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  promtail:
    extends:
      file: ../common/docker-compose.yml
      service: promtail
    env_file:
      - ../../../.env.development
    volumes:
      - ../common/promtail/config:/etc/promtail
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
    depends_on:
      - loki

  node-exporter:
    extends:
      file: ../common/docker-compose.yml
      service: node-exporter
    env_file:
      - ../../../.env.development
    networks:
      - monitoring

  postgres-exporter:
    extends:
      file: ../common/docker-compose.yml
      service: postgres-exporter
    command:
      - "--web.listen-address=:9187"
      - "--web.telemetry-path=/metrics"
      - "--extend.query-path=/etc/postgres_exporter/queries.yaml"
    env_file:
      - ../../../.env.development
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    networks:
      - monitoring
      - backend
    depends_on:
      - db

  grafana:
    extends:
      file: ../common/docker-compose.yml
      service: grafana
    env_file:
      - ../../../.env.development
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
    volumes:
      - ../common/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
    driver: local
    name: monitoring_prometheus_development
  loki_data:
    driver: local
    name: monitoring_loki_development
  grafana_data:
    driver: local
    name: monitoring_grafana_development

networks:
  monitoring:
    name: monitoring-development
    driver: bridge
  backend:
    external: true
